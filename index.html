<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mousse de Maracujá</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>
    <main class="pagina">

        <div class="sementes sementes-top">
            <span>•</span>
            <span>•</span>
            <span>•</span>
        </div>

        <div class="detalhe-lateral detalhe-esquerdo"></div>
        <div class="detalhe-lateral detalhe-direito"></div>

        <header class="cabecalho">
            <p class="mini-titulo">
                um clássico brasileiro
            </p>

            <h1>
                mousse
                <span>de maracujá</span>
            </h1>
        </header>

        <section class="sobremesa">
            <div class="imagem-container">
                <div class="brilho brilho-1"></div>
                <div class="brilho brilho-2"></div>
                <img src="Mousse_de_Maracujá.jpg" alt="Mousse de maracujá" class="imagem-mousse">
            </div>
        </section>

        <section class="descricao">
            <p> cremoso, geladinho <br> e levemente azedinho.</p>
            <div class="linha"></div>
            <p class="detalhe"> feito com maracujá </p>
        </section>

        <footer>
            <span>mousse</span>
            <span>•</span>
            <span>maracujá</span>
        </footer>

    </main>
</body>
</html>


name: Build, Push and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mousse-de-maracuja:latest

      - name: Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy no servidor Azure
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e
             IMAGE='$DOCKER_USERNAME/mousse-de-maracuja:latest'
             CONTAINER='mousse-de-maracuja'

             docker pull \"\$IMAGE\"

             (docker rm -f \"\$CONTAINER\" >/dev/null 2>&1 || true)

             PORT=8083
             MAX_PORT=8099
             FOUND=0

             while [ \"\$PORT\" -le \"\$MAX_PORT\" ]; do
               if ! sudo ss -ltnH \"sport = :\$PORT\" | grep -q .; then
                 if ! docker ps --format '{{.Ports}}' | grep -E \"0\\.0\\.0\\.0:\$PORT->|\\*:\$PORT->\" >/dev/null; then
                   FOUND=1
                   break
                 fi
               fi

               PORT=\$((PORT + 1))
             done

             if [ \"\$FOUND\" -ne 1 ]; then
               echo 'Nenhuma porta livre encontrada entre 8083 e 8099.'
               exit 1
             fi

             echo \"Porta escolhida: \$PORT\"

             docker run -d \
               --name \"\$CONTAINER\" \
               --restart unless-stopped \
               -p \"\$PORT:80\" \
               \"\$IMAGE\"

             docker ps --filter name=\"\$CONTAINER\"

             echo \"PORTA_DEPLOY=\$PORT\""
